<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d84c35">
  <title>用餐小站｜後台管理</title>
  <style>
    :root{--bg:#f6f3ee;--panel:#fff;--ink:#201b17;--muted:#83766b;--line:#e6dfd5;--brand:#d84c35;--brand-dark:#b63a25;--green:#248255;--amber:#b87515;--danger:#be3a3a;--shadow:0 8px 24px rgba(60,40,20,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#201b17;color:#fff;padding:24px 16px}.brand{font-size:22px;font-weight:900;margin:0 8px 28px}.nav{display:grid;gap:8px}.nav button{padding:12px 14px;text-align:left;border-radius:10px;background:transparent;color:#d9d1ca;font-weight:800}.nav button.active,.nav button:hover{background:#3a2f29;color:#fff}.main{width:100%;max-width:1400px;padding:28px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.topbar h1{margin:4px 0 0;font-size:28px}.muted{color:var(--muted);font-size:13px}.btn{padding:10px 14px;border-radius:10px;font-weight:800;background:#eee8df;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff}.btn.danger{background:#fdf0f0;color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-label{font-size:12px;color:var(--muted);font-weight:800}.stat-value{font-size:29px;font-weight:900;margin-top:5px}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h2{font-size:20px;margin:0}.view{display:none}.view.active{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.toolbar input{min-width:220px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#fdf5e7;color:var(--amber)}.preparing{background:#eaf0ff;color:#3263a8}.ready{background:#eaf6ef;color:var(--green)}.completed{background:#eee;color:#666}.cancelled{background:#fdf0f0;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:35px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form{display:grid;gap:6px}.form label{font-size:12px;color:var(--muted);font-weight:800}.form textarea{min-height:80px;resize:vertical}.form-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.menu-list{display:grid;gap:10px}.menu-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}.emoji{display:grid;place-items:center;background:#fef0ec;border-radius:10px;width:44px;height:44px;font-size:22px}.menu-row h3{margin:0;font-size:16px}.menu-row p{margin:2px 0 0;color:var(--muted);font-size:13px}.menu-actions{display:flex;gap:6px}.queue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.queue-card{border:1px solid var(--line);border-radius:14px;padding:16px}.queue-number{font-size:30px;font-weight:900;color:var(--brand-dark)}.queue-card p{margin:5px 0;color:var(--muted)}.backup-actions{display:flex;flex-wrap:wrap;gap:10px}.notice{padding:12px;border-radius:10px;background:#eaf6ef;color:var(--green);margin-bottom:14px;display:none}.notice.show{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{padding:14px}.brand{margin-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:16px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:10px;flex-direction:column}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🍱 用餐小站</div>
      <nav class="nav">
        <button class="active" data-view="orders">訂單管理</button>
        <button data-view="menu">菜單管理</button>
        <button data-view="queue">叫號管理</button>
        <button data-view="backup">備份還原</button>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="muted">ADMINISTRATION</div><h1 id="viewTitle">訂單管理</h1></div><a class="btn" href="kiosk.html">開啟前台</a></header>
      <div id="notice" class="notice"></div>
      <section class="stats"><div class="stat"><div class="stat-label">今日訂單</div><div class="stat-value" id="statOrders">0</div></div><div class="stat"><div class="stat-label">今日營收</div><div class="stat-value" id="statRevenue">$0</div></div><div class="stat"><div class="stat-label">待處理</div><div class="stat-value" id="statPending">0</div></div><div class="stat"><div class="stat-label">待取餐</div><div class="stat-value" id="statReady">0</div></div></section>

      <section id="ordersView" class="view active panel"><div class="panel-head"><h2>訂單列表</h2><button class="btn small" id="refreshBtn">重新整理</button></div><div class="toolbar"><input id="orderSearch" placeholder="搜尋訂單號、桌號或電話末三碼"><select id="statusFilter"><option value="all">全部狀態</option><option value="pending">待接單</option><option value="preparing">製作中</option><option value="ready">待取餐</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div><div class="table-wrap"><table><thead><tr><th>訂單號</th><th>時間</th><th>桌號/識別</th><th>餐點</th><th>金額</th><th>狀態</th><th>操作</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>

      <section id="menuView" class="view"><div class="panel"><div class="panel-head"><h2>菜單管理</h2><button class="btn primary" id="newMenuBtn">新增餐點</button></div><div id="menuForm" hidden class="panel" style="background:#fcfbf8;box-shadow:none;margin-bottom:16px"><div class="form-grid"><div class="form"><label>餐點名稱</label><input id="menuName" required></div><div class="form"><label>分類</label><input id="menuCategory" placeholder="主餐、飲品、甜點"></div><div class="form"><label>價格</label><input id="menuPrice" type="number" min="0"></div><div class="form"><label>圖示 Emoji</label><input id="menuEmoji" placeholder="🍱"></div></div><div class="form-actions"><button class="btn primary" id="saveMenuBtn">儲存</button><button class="btn" id="cancelMenuBtn">取消</button></div></div><div id="menuList" class="menu-list"></div></div></section>

      <section id="queueView" class="view panel"><div class="panel-head"><h2>叫號管理</h2><button class="btn primary" id="callNextBtn">叫下一號</button></div><p class="muted">「待取餐」的訂單會顯示在這裡。叫號後可使用瀏覽器語音播報。</p><div id="queueList" class="queue-grid"></div></section>

      <section id="backupView" class="view panel"><div class="panel-head"><h2>備份與還原</h2></div><p class="muted">本版本使用瀏覽器 localStorage。備份檔包含訂單、菜單及目前叫號狀態。</p><div class="backup-actions"><button class="btn primary" id="exportBtn">下載備份 JSON</button><label class="btn" for="importFile">選擇備份還原</label><input id="importFile" type="file" accept="application/json" hidden><button class="btn danger" id="clearOrdersBtn">清除全部訂單</button></div></section>
    </main>
  </div>

  <script>
    const KEYS={orders:'kiosk_orders',menu:'kiosk_menu',called:'kiosk_last_called'};
    const defaultMenu=[{id:1,category:'主餐',name:'香煎雞腿排',price:120,emoji:'🍗'},{id:2,category:'主餐',name:'牛肉丼',price:150,emoji:'🍱'},{id:3,category:'主餐',name:'豚骨拉麵',price:140,emoji:'🍜'},{id:4,category:'飲品',name:'珍珠奶茶',price:60,emoji:'🧋'},{id:5,category:'飲品',name:'檸檬氣泡水',price:45,emoji:'🍋'},{id:6,category:'甜點',name:'芒果冰',price:70,emoji:'🥭'}];
    let orders=read(KEYS.orders,[]), menu=read(KEYS.menu,defaultMenu), editingId=null;
    const $=id=>document.getElementById(id); function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}} function save(){localStorage.setItem(KEYS.orders,JSON.stringify(orders));localStorage.setItem(KEYS.menu,JSON.stringify(menu))} function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function notify(text){$('notice').textContent=text;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)};
    function statusText(s){return {pending:'待接單',preparing:'製作中',ready:'待取餐',completed:'已完成',cancelled:'已取消'}[s]||'待接單'}
    function renderStats(){const today=new Date().toLocaleDateString('zh-TW');const todayOrders=orders.filter(o=>(o.timestamp||'').includes(today)||new Date(o.createdAt||0).toLocaleDateString('zh-TW')===today);$('statOrders').textContent=todayOrders.length;$('statRevenue').textContent='$'+todayOrders.filter(o=>o.status!=='cancelled').reduce((n,o)=>n+Number(o.total||0),0);$('statPending').textContent=orders.filter(o=>['pending','preparing'].includes(o.status||'pending')).length;$('statReady').textContent=orders.filter(o=>o.status==='ready').length}
    function renderOrders(){const q=$('orderSearch').value.trim().toLowerCase(), filter=$('statusFilter').value;const list=orders.filter(o=>{const text=[o.id,o.customer,o.diningType].join(' ').toLowerCase();return(!q||text.includes(q))&&(filter==='all'||(o.status||'pending')===filter)}).slice().reverse();$('ordersBody').innerHTML=list.length?list.map(o=>`<tr><td><b>#${esc(o.id)}</b></td><td>${esc(o.timestamp||'')}</td><td>${esc(o.customer)}<br><span class="muted">${esc(o.diningType||'')}</span></td><td>${(o.items||[]).map(i=>`${esc(i.name)} ×${i.qty}`).join('<br>')}</td><td>$${Number(o.total||0)}</td><td><span class="tag ${o.status||'pending'}">${statusText(o.status||'pending')}</span></td><td><button class="btn small primary" data-order="${esc(o.id)}">更新狀態</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">目前沒有訂單</td></tr>';document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>advanceOrder(b.dataset.order))}
    function advanceOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const next={pending:'preparing',preparing:'ready',ready:'completed',completed:'completed',cancelled:'cancelled'};o.status=next[o.status||'pending'];save();renderAll();notify(`訂單 #${id} 已更新為${statusText(o.status)}`)}
    function renderMenu(){ $('menuList').innerHTML=menu.map(i=>`<div class="menu-row"><div class="emoji">${esc(i.emoji)}</div><div><h3>${esc(i.name)}</h3><p>${esc(i.category)} ・ $${Number(i.price)}</p></div><div class="menu-actions"><button class="btn small" data-edit="${i.id}">編輯</button><button class="btn small danger" data-delete="${i.id}">刪除</button></div></div>`).join('')||'<div class="empty">尚無餐點</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMenuForm(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMenu(Number(b.dataset.delete)))}
    function openMenuForm(id=null){editingId=id;const i=menu.find(x=>x.id===id);$('menuForm').hidden=false;$('menuName').value=i?.name||'';$('menuCategory').value=i?.category||'主餐';$('menuPrice').value=i?.price||'';$('menuEmoji').value=i?.emoji||'🍱';$('menuName').focus()}
    function closeMenuForm(){$('menuForm').hidden=true;editingId=null}
    function saveMenu(){const name=$('menuName').value.trim(),category=$('menuCategory').value.trim()||'其他',price=Number($('menuPrice').value),emoji=$('menuEmoji').value.trim()||'🍱';if(!name||price<0||!Number.isFinite(price)){alert('請完整填寫餐點名稱與有效價格');return}if(editingId){Object.assign(menu.find(x=>x.id===editingId),{name,category,price,emoji})}else menu.push({id:Date.now(),name,category,price,emoji});save();closeMenuForm();renderMenu();notify('菜單已儲存')}
    function deleteMenu(id){if(!confirm('確定刪除此餐點？'))return;menu=menu.filter(x=>x.id!==id);save();renderMenu();notify('餐點已刪除')}
    function renderQueue(){const list=orders.filter(o=>o.status==='ready').slice().reverse();$('queueList').innerHTML=list.length?list.map(o=>`<article class="queue-card"><div class="queue-number">${esc(o.id)}</div><p>桌號/識別：${esc(o.customer)}</p><p>${(o.items||[]).map(i=>`${esc(i.name)} ×${i.qty}`).join('、')}</p><button class="btn primary small" data-complete="${esc(o.id)}">完成取餐</button></article>`).join(''):'<div class="empty">目前沒有待取餐訂單</div>';document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const o=orders.find(x=>x.id===b.dataset.complete);if(o){o.status='completed';save();renderAll();}})}
    function callNext(){const o=orders.find(x=>x.status==='ready');if(!o){alert('目前沒有待取餐訂單');return}localStorage.setItem(KEYS.called,o.id);renderQueue();if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(`請 ${o.id} 號客人取餐`));notify(`已叫號：${o.id}`)}
    function renderAll(){renderStats();renderOrders();renderMenu();renderQueue()}
    document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(b.dataset.view+'View').classList.add('active');$('viewTitle').textContent=b.textContent});$('orderSearch').oninput=renderOrders;$('statusFilter').onchange=renderOrders;$('refreshBtn').onclick=()=>{orders=read(KEYS.orders,[]);menu=read(KEYS.menu,defaultMenu);renderAll();notify('資料已重新整理')};$('newMenuBtn').onclick=()=>openMenuForm();$('cancelMenuBtn').onclick=closeMenuForm;$('saveMenuBtn').onclick=saveMenu;$('callNextBtn').onclick=callNext;
    $('exportBtn').onclick=()=>{const data={version:1,exportedAt:new Date().toISOString(),orders,menu,lastCalled:localStorage.getItem(KEYS.called)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kiosk-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
    $('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.orders)||!Array.isArray(data.menu))throw Error();orders=data.orders;menu=data.menu;save();if(data.lastCalled)localStorage.setItem(KEYS.called,data.lastCalled);renderAll();notify('備份已還原')}catch{alert('備份格式不正確')}};reader.readAsText(file);e.target.value=''};
    $('clearOrdersBtn').onclick=()=>{if(confirm('確定清除全部訂單？此操作無法復原，建議先下載備份。')){orders=[];save();renderAll();notify('訂單已清除')}};renderAll();
  </script>
</body>
</html>
