<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料瀏覽</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family:"微軟正黑體",sans-serif; margin:0; background:#f4f4f4; }
    #sticky-header {
      position:sticky; top:0; z-index:100;
      background:#f4f4f4; padding:8px 12px 6px;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
      display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    }
    .search-row { display:flex; align-items:center; gap:6px; flex:1; flex-wrap:wrap; }
    select,input[type=text] { padding:5px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
    input[type=text]   { width:180px; }
    input[type=number] { width:48px; padding:5px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
    .rec-info { font-size:13px; color:#555; white-space:nowrap; }
    .status { font-size:12px; padding:3px 10px; border-radius:4px; white-space:nowrap; }
    .status.loading { background:#fff3cd; color:#856404; border:1px solid #ffc107; }
    .status.cached  { background:#d4edda; color:#155724; border:1px solid #28a745; }
    .status.fresh   { background:#cce5ff; color:#004085; border:1px solid #0056b3; }
    .status.error   { background:#f8d7da; color:#721c24; border:1px solid #dc3545; }
    .reload-btn { padding:3px 8px; background:#e74c3c; color:#fff;
                  border:none; border-radius:3px; cursor:pointer; font-size:12px; }
    #main { padding:4px 12px 20px; }
    .table-wrap { overflow-x:auto; border:1px solid #ccc; background:#fff; }
    table { width:100%; border-collapse:collapse; table-layout:auto; }
    th { background:#2c3e50; color:#fff; padding:8px 10px; border:1px solid #445;
         white-space:nowrap; cursor:pointer; user-select:none; font-size:13px; }
    th.asc::after  { content:" ▲"; font-size:10px; }
    th.desc::after { content:" ▼"; font-size:10px; }
    td { border:1px solid #ddd; padding:5px 8px; font-size:13px;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
    tr:nth-child(even) { background:#fafafa; }
    tr:hover { background:#e8f5ff; }
    .pagination { margin-top:10px; display:flex; align-items:center;
                  gap:4px; justify-content:center; flex-wrap:wrap; font-size:13px; }
    .pagination button { padding:4px 10px; background:#444; color:#fff;
                         border:none; border-radius:3px; cursor:pointer; }
    .pagination button:disabled { background:#ccc; cursor:default; }

    .view-tabs { display:flex; gap:2px; margin-left:auto; }
    .view-tabs button { padding:6px 16px; font-size:13px; border:1px solid #ccc;
                         background:#fff; color:#555; cursor:pointer; }
    .view-tabs button:first-child { border-radius:4px 0 0 4px; }
    .view-tabs button:last-child  { border-radius:0 4px 4px 0; border-left:none; }
    .view-tabs button.active { background:#2c3e50; color:#fff; border-color:#2c3e50; }

    .chart-controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
                       background:#fff; border:1px solid #ccc; border-bottom:none;
                       padding:8px 12px; font-size:13px; }
    .chart-controls select { padding:4px 6px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
    .chart-hint { color:#888; font-size:12px; }
    .chart-wrap { border:1px solid #ccc; background:#fff; padding:10px 6px 4px; }
    .chart-wrap svg { width:100%; height:400px; display:block; }
    .bar-zero { stroke:#bbb; stroke-width:1; }
    .bar-rect { transition:opacity .15s; }
    .bar-rect:hover { opacity:.75; }
    .bar-value { font-size:11px; fill:#333; text-anchor:middle; }
    .bar-label { font-size:11px; fill:#555; }
    .chart-empty { text-align:center; color:#888; padding:40px 0; }
  </style>
  <script>if(location.protocol==="file:"){var _j=location.pathname.split('/').pop().replace(/\.htm$/i,'.json');document.write('<script src="'+_j+'" charset="big5"><\/script>');}</script>
</head>
<body>
<div id="app">
  <div id="sticky-header">
    <div class="search-row">
      <select v-model="searchCol">
        <option value="__all__">All Columns</option>
        <option v-for="(col,i) in cols" :key="i" :value="i">{{ col }}</option>
      </select>
      <input type="text" v-model="searchQuery"
             @input="searchQuery=searchQuery.toUpperCase()"
             placeholder="輸入搜尋條件...">
      <span class="rec-info">
        目前筆數 {{ rangeStart }}-{{ rangeEnd }} / 總筆數 {{ filteredData.length }}
        &nbsp;每頁顯示 <input type="number" v-model.number="rowsPerPage" min="5" max="999">
      </span>
    </div>
    <div :class="['status', cacheStatus.type]">
      {{ cacheStatus.msg }}
      <button v-if="cacheStatus.type!=='loading' && !isFile" class="reload-btn" @click="reloadData">Reload</button>
    </div>
    <div class="view-tabs">
      <button :class="{active:activeTab==='table'}" @click="activeTab='table'">表格</button>
      <button :class="{active:activeTab==='chart'}" @click="switchToChart">長條圖</button>
    </div>
  </div>

  <div id="main">
    <div v-show="activeTab==='table'">
    <div class="table-wrap">
      <table>
        <thead v-if="cols.length>0">
          <tr>
            <th v-for="(col,i) in cols" :key="i"
                :class="sortKey===i?(sortAsc?'asc':'desc'):''"
                @click="doSort(i)">{{ col }}</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(row,ri) in paginatedData" :key="ri">
            <td v-for="(cell,ci) in row" :key="ci"
                :align="numCols.has(ci)?'right':'left'"
                :title="String(cell)">{{ numCols.has(ci) ? fmtNum(cell) : cell }}</td>
          </tr>
          <tr v-if="filteredData.length===0 && cacheStatus.type!=='loading'">
            <td :colspan="cols.length||1" style="text-align:center;padding:20px;color:#888;">沒有資料</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <button @click="currentPage=1"          :disabled="currentPage===1">&#9664;&#9664;</button>
      <button @click="currentPage--"          :disabled="currentPage===1">&#9664;</button>
      <select v-model.number="currentPage">
        <option v-for="p in totalPages" :key="p" :value="p">{{ p }}</option>
      </select>
      <button @click="currentPage++"          :disabled="currentPage>=totalPages">&#9654;</button>
      <button @click="currentPage=totalPages" :disabled="currentPage>=totalPages">&#9654;&#9654;</button>
      <span>( 目前頁數 {{ currentPage }} / 總頁數 {{ totalPages }} )</span>
      <a href="#" @click.prevent="rowsPerPage=filteredData.length||9999"
         style="margin-left:8px;color:#e74c3c;font-size:12px;">顯示全部明細</a>
    </div>
    </div>

    <div v-show="activeTab==='chart'">
      <div class="chart-controls">
        <label>標籤欄位
          <select v-model.number="chartLabelCol">
            <option v-for="(col,i) in cols" :key="i" :value="i">{{ col }}</option>
          </select>
        </label>
        <label>數值欄位
          <select v-model.number="chartValueCol">
            <option v-for="i in numColsArr" :key="i" :value="i">{{ cols[i] }}</option>
          </select>
        </label>
        <span class="chart-hint">提示：先在「表格」頁排序＋設定每頁筆數（例如10筆），切到長條圖即為 Top{{ rowsPerPage }}</span>
      </div>
      <div class="chart-wrap" ref="chartWrap">
        <svg v-if="chartBars.length" :viewBox="'0 0 '+chartW+' '+chartH">
          <line class="bar-zero" :x1="chartML" :x2="chartW-chartMR" :y1="chartBaseY" :y2="chartBaseY"/>
          <g v-for="(b,i) in chartBars" :key="i">
            <rect class="bar-rect" :x="b.x" :y="b.y" :width="b.w" :height="b.h" :fill="b.color" rx="2">
              <title>{{ b.label }}：{{ b.valueStr }}</title>
            </rect>
            <text class="bar-value" :x="b.cx" :y="b.value>=0 ? b.y-4 : b.y+b.h+13">{{ b.valueStr }}</text>
            <text class="bar-label" :x="b.cx" :y="chartH-chartMB+22" text-anchor="end"
                  :transform="'rotate(-35 '+b.cx+' '+(chartH-chartMB+22)+')'">{{ b.labelShort }}<title>{{ b.label }}</title></text>
          </g>
        </svg>
        <div v-else class="chart-empty">目前頁面沒有可繪製的數值資料</div>
      </div>
    </div>
  </div>
</div>
<script>
/* ============================================================
   _foot.htm  通用版  BIG5 + IDB 快取
   data.json 格式: { "cols":[...], "numCols":[...], "rows":[[...]] }
   file://  → 用 INLINE_DATA
   https:// → IDB 快取 → fetch data.json (TextDecoder big5)
   ============================================================ */
const DB_NAME  = 'TinyDB';
const DB_STORE = 'cache';
const TTL_MS   = 24 * 60 * 60 * 1000;
const JSON_URL = location.pathname.split('/').pop().replace(/\.htm$/i,'.json');

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore(DB_STORE,{keyPath:'key'});
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
function dbGet(db,key){
  return new Promise((res,rej)=>{
    const r=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(key);
    r.onsuccess=e=>res(e.target.result||null);
    r.onerror=e=>rej(e.target.error);
  });
}
function dbSet(db,key,val){
  return new Promise((res,rej)=>{
    const r=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE)
              .put({key,cols:val.cols,numCols:val.numCols,rows:val.rows,ts:Date.now()});
    r.onsuccess=()=>res();
    r.onerror=e=>rej(e.target.error);
  });
}
function dbDel(db,key){
  return new Promise((res,rej)=>{
    const r=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).delete(key);
    r.onsuccess=()=>res();
    r.onerror=e=>rej(e.target.error);
  });
}
function fmtAge(ms){
  const s=Math.floor(ms/1000);
  if(s<60) return s+'\u79d2';
  if(s<3600) return Math.floor(s/60)+'\u5206\u9418';
  return Math.floor(s/3600)+'\u5c0f\u6642';
}

const { createApp } = Vue;
createApp({
  data(){
    return {
      cols:[], rows:[], numCols:new Set(),
      searchQuery:'', searchCol:'__all__',
      currentPage:1, rowsPerPage:10,
      sortKey:null, sortAsc:true,
      isFile: location.protocol==='file:',
      cacheStatus:{type:'loading', msg:'\u8f09\u5165\u4e2d\u2026'},
      _db:null,
      activeTab:'table',
      chartValueCol:null,
      chartLabelCol:null,
      chartW:900, chartH:400, chartML:46, chartMR:16, chartMT:16, chartMB:98
    };
  },

  async mounted(){
    try{
      this._db = await openDB();
      if(this.isFile){
        /* file:// → INLINE_DATA */
        if(typeof INLINE_DATA !== 'undefined'){
          this._apply(INLINE_DATA);
          this.cacheStatus={type:'cached',
            msg:'[\u5167\u5d4c] \u5171'+INLINE_DATA.rows.length+'\u7b46'};
        }else{
          this.cacheStatus={type:'error',
            msg:'[\u932f\u8aa4] \u627e\u4e0d\u5230 INLINE_DATA'};
        }
      }else{
        await this.loadData(false);
      }
    }catch(e){
      this.cacheStatus={type:'error',msg:'\u521d\u59cb\u5316\u5931\u6557\uff1a'+e.message};
    }
    this._measureChart();
    window.addEventListener('resize', this._measureChart);
  },
  beforeUnmount(){
    window.removeEventListener('resize', this._measureChart);
  },

  methods:{
    _measureChart(){
      const el = this.$refs.chartWrap;
      if(el && el.clientWidth) this.chartW = Math.max(el.clientWidth - 32, 320);
    },
    _apply(d){
      this.cols    = d.cols||[];
      this.numCols = new Set(d.numCols||[]);
      this.rows    = Object.freeze(d.rows||[]);
      this.chartValueCol = null;
      this.chartLabelCol = null;
    },
    async loadData(force){
      this.cacheStatus={type:'loading',msg:'\u8f09\u5165\u4e2d\u2026'};
      const ckey=location.pathname;
      if(!force){
        try{
          const c=await dbGet(this._db,ckey);
          if(c&&(Date.now()-c.ts)<TTL_MS){
            this._apply(c);
            this.cacheStatus={type:'cached',
              msg:'[\u5feb\u53d6] '+fmtAge(Date.now()-c.ts)+'\u524d\uff0c\u5171'+c.rows.length+'\u7b46'};
            return;
          }
        }catch(_){}
      }
      await this._fetch(ckey);
    },
    async _fetch(ckey){
      try{
        const res=await fetch(JSON_URL,{cache:'no-cache'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        /* BIG5 TextDecoder 解碼 */
        const buf=await res.arrayBuffer();
        let txt=new TextDecoder('big5').decode(buf);
        /* 去掉 JS 外殼: const INLINE_DATA={...}; */
        txt=txt.trim().replace(/^const\s+INLINE_DATA\s*=\s*/,'').replace(/;\s*$/,'');
        const d=JSON.parse(txt);
        await dbSet(this._db,ckey,d);
        this._apply(d);
        this.cacheStatus={type:'fresh',
          msg:'[\u66f4\u65b0] \u5df2\u8f09\u5165\uff0c\u5171'+d.rows.length+'\u7b46\uff0c\u5df2\u5beb\u5165IDB'};
      }catch(e){
        try{
          const c=await dbGet(this._db,location.pathname);
          if(c&&c.rows&&c.rows.length){
            this._apply(c);
            this.cacheStatus={type:'cached',
              msg:'[\u6ce8\u610f] \u7db2\u8def\u5931\u6557\uff0c\u4f7f\u7528\u820a\u5feb\u53d6\uff0c\u5171'+c.rows.length+'\u7b46'};
            return;
          }
        }catch(_){}
        this.cacheStatus={type:'error',msg:'[\u932f\u8aa4] '+e.message};
      }
    },
    async reloadData(){
      if(this._db) await dbDel(this._db,location.pathname);
      await this.loadData(true);
    },
    fmtNum(v){
      if(v===null||v===undefined||v==='') return '';
      const n=parseFloat(v);
      if(isNaN(n)) return v;
      return n.toFixed(2);
    },
    doSort(i){
      if(this.sortKey===i){this.sortAsc=!this.sortAsc;}
      else{this.sortKey=i;this.sortAsc=true;}
      this.currentPage=1;
    },
    switchToChart(){
      if(this.chartValueCol===null){
        const arr=this.numColsArr;
        this.chartValueCol = (this.sortKey!==null && this.numCols.has(this.sortKey))
          ? this.sortKey : (arr.length?arr[0]:null);
      }
      if(this.chartLabelCol===null){
        this.chartLabelCol = this._guessLabelCol();
      }
      this.activeTab='chart';
      this.$nextTick(this._measureChart);
    },
    _guessLabelCol(){
      const prefer = ['簡稱','名稱','品名','客戶','項目'];
      for(const kw of prefer){
        const idx=this.cols.findIndex((c,i)=>!this.numCols.has(i) && c.indexOf(kw)>-1);
        if(idx>-1) return idx;
      }
      const avoid = ['日期','號碼','代號','編號','代碼'];
      const idx=this.cols.findIndex((c,i)=>!this.numCols.has(i) && !avoid.some(kw=>c.indexOf(kw)>-1));
      if(idx>-1) return idx;
      const idx2=this.cols.findIndex((c,i)=>!this.numCols.has(i));
      return idx2>=0 ? idx2 : 0;
    }
  },

  computed:{
    filteredData(){
      let data=this.rows;
      if(this.searchQuery){
        const s=this.searchQuery.toLowerCase();
        if(this.searchCol==='__all__'){
          data=data.filter(r=>r.some(v=>String(v).toLowerCase().includes(s)));
        }else{
          const ci=parseInt(this.searchCol);
          data=data.filter(r=>String(r[ci]).toLowerCase().includes(s));
        }
      }
      if(this.sortKey!==null){
        const k=this.sortKey,asc=this.sortAsc,isNum=this.numCols.has(k);
        data=data.slice().sort((a,b)=>{
          if(isNum) return ((parseFloat(a[k])||0)-(parseFloat(b[k])||0))*(asc?1:-1);
          return String(a[k]).localeCompare(String(b[k]),'zh-TW')*(asc?1:-1);
        });
      }
      return data;
    },
    totalPages(){return Math.ceil(this.filteredData.length/this.rowsPerPage)||1;},
    paginatedData(){
      const s=(this.currentPage-1)*this.rowsPerPage;
      return this.filteredData.slice(s,s+this.rowsPerPage);
    },
    rangeStart(){return this.filteredData.length===0?0:(this.currentPage-1)*this.rowsPerPage+1;},
    rangeEnd(){return Math.min(this.currentPage*this.rowsPerPage,this.filteredData.length);},

    numColsArr(){ return Array.from(this.numCols).sort((a,b)=>a-b); },

    chartBaseY(){
      if(!this.chartBars.length) return this.chartMT;
      return this.chartBars[0]._baseY;
    },

    chartBars(){
      if(this.chartValueCol===null || this.chartLabelCol===null) return [];
      const rows=this.paginatedData;
      if(!rows.length) return [];
      const vc=this.chartValueCol, lc=this.chartLabelCol;
      const vals=rows.map(r=>parseFloat(r[vc])||0);
      /* 訊號壓縮：用立方根轉換，避免極端值把其餘長條壓到看不見，同時保留大小順序 */
      const f = v => Math.sign(v)*Math.cbrt(Math.abs(v));
      const fvals = vals.map(f);
      const maxF=Math.max(0,...fvals), minF=Math.min(0,...fvals);
      const rangeF=(maxF-minF)||1;
      const W=this.chartW,H=this.chartH,ML=this.chartML,MR=this.chartMR,MT=this.chartMT,MB=this.chartMB;
      const plotW=W-ML-MR, plotH=H-MT-MB;
      const scaleY = v => MT + plotH*(maxF-f(v))/rangeF;
      const baseY = scaleY(0);
      const groupW = plotW/rows.length;
      const barW = Math.max(groupW*0.55, 4);
      return rows.map((r,i)=>{
        const v = vals[i];
        const cx = ML + groupW*(i+0.5);
        const y1 = scaleY(v);
        const top = Math.min(y1, baseY), h = Math.max(Math.abs(y1-baseY), 1);
        return {
          x: cx-barW/2, y: top, w: barW, h,
          cx, value: v, valueStr: v.toLocaleString('zh-Hant'),
          label: String(r[lc]),
          labelShort: String(r[lc]).length>10 ? String(r[lc]).slice(0,10)+'…' : String(r[lc]),
          color: v<0 ? '#c0392b' : '#2c81ba',
          _baseY: baseY
        };
      });
    }
  },

  watch:{
    searchQuery(){this.currentPage=1;},
    searchCol(){this.currentPage=1;},
    rowsPerPage(){this.currentPage=1;}
  }
}).mount('#app');
</script>
</body>
</html>
