<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員身分綁定</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ── Design Tokens ── */
  :root{
    --bg:#13110F;
    --gold:#D4A843;
    --gold-light:#e8c06a;
    --gold-dim:#8a7333;
    --gold-glow:rgba(212,168,67,0.16);
    --panel:rgba(255,255,255,0.035);
    --border:rgba(212,168,67,0.28);
    --text:#EDE6D6;
    --muted:#a89f8f;
    --faint:#5c5548;
    --danger:#c0524a;
    --danger-bg:rgba(192,82,74,0.10);
    --ok:#4e9460;
    --ok-bg:rgba(78,148,96,0.10);
    --radius:18px;
    --radius-sm:11px;
    --radius-xs:8px;
    --t:0.22s ease;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(212,168,67,0.07) 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ── Card ── */
  .card{
    width:100%;
    max-width:400px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    backdrop-filter:blur(12px);
    text-align:center;
    box-shadow:
      0 1px 0 rgba(212,168,67,0.15) inset,
      0 12px 48px rgba(0,0,0,0.6);
  }

  /* ── Top Accent Bar ── */
  .card-accent{
    height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.8;
  }

  .card-body{ padding:28px 24px 24px; }

  /* ── Step Dots ── */
  .steps{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:22px;
  }
  .step-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(212,168,67,0.2);
    border:1px solid rgba(212,168,67,0.25);
    transition:all 0.35s cubic-bezier(0.34,1.4,0.64,1);
  }
  .step-dot.active{
    background:var(--gold);
    border-color:var(--gold);
    transform:scale(1.25);
    box-shadow:0 0 6px rgba(212,168,67,0.5);
  }
  .step-dot.done{
    background:var(--ok);
    border-color:var(--ok);
  }
  .step-line{
    width:24px; height:1px;
    background:rgba(212,168,67,0.2);
    transition:background 0.35s;
  }
  .step-line.done{ background:var(--ok); }

  /* ── Badge ── */
  .biz-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--gold);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px 12px;
    margin-bottom:12px;
    letter-spacing:0.8px;
    background:var(--gold-glow);
  }
  .biz-badge::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:var(--gold);
    animation:pulse 2s ease infinite;
  }

  /* ── Headings ── */
  h1{
    font-size:19px;
    margin-bottom:6px;
    color:var(--gold);
    letter-spacing:0.5px;
  }
  p.sub{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:22px;
    line-height:1.65;
  }

  /* ── Divider ── */
  .divider{
    border:none;
    border-top:1px solid rgba(212,168,67,0.12);
    margin:18px 0;
  }

  /* ── Profile Card ── */
  .profile{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(212,168,67,0.12);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:18px;
    text-align:left;
    animation:slideUp 0.35s ease;
  }
  .avatar-wrap{
    position:relative;
    flex-shrink:0;
  }
  .avatar-wrap img{
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid rgba(212,168,67,0.4);
    display:block;
  }
  .avatar-check{
    position:absolute;
    bottom:-2px; right:-2px;
    width:16px; height:16px;
    background:var(--ok);
    border-radius:50%;
    border:2px solid var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    color:#fff;
    line-height:1;
  }
  .profile-info{ flex:1; min-width:0; }
  .profile-name{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .profile-hint{
    font-size:11px;
    color:var(--ok);
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  /* ── Field ── */
  .field{ text-align:left; margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:7px;
    letter-spacing:0.3px;
  }
  .input-wrap{ position:relative; }
  .input-wrap input{
    width:100%;
    padding:11px 12px 11px 38px;
    border-radius:var(--radius-xs);
    border:1px solid var(--border);
    background:rgba(0,0,0,0.22);
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color var(--t), box-shadow var(--t);
  }
  .input-wrap input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,168,67,0.08);
  }
  .input-wrap input[readonly]{
    color:var(--gold);
    background:rgba(212,168,67,0.06);
    cursor:default;
  }
  .input-icon{
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    font-size:14px;
    opacity:0.45;
    pointer-events:none;
  }

  /* ── Primary Button ── */
  .btn-primary{
    width:100%; padding:13px;
    border:none; border-radius:var(--radius-sm);
    background:linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    color:#1a1710;
    font-size:15px; font-weight:bold;
    cursor:pointer; letter-spacing:1px;
    transition:all var(--t);
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 4px 14px rgba(212,168,67,0.25);
  }
  .btn-primary:hover:not(:disabled){
    filter:brightness(1.07);
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(212,168,67,0.35);
  }
  .btn-primary:active:not(:disabled){
    transform:translateY(0);
    box-shadow:0 2px 8px rgba(212,168,67,0.2);
  }
  .btn-primary:disabled{
    background:linear-gradient(135deg, #6a6040, #4a4025);
    color:#666;
    cursor:not-allowed;
    box-shadow:none;
  }

  /* ── Ghost Button ── */
  .btn-ghost{
    margin-top:10px; width:100%; padding:10px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:transparent; color:var(--muted);
    font-size:13px; cursor:pointer;
    transition:all var(--t);
    letter-spacing:0.3px;
  }
  .btn-ghost:hover{
    background:var(--gold-glow);
    color:var(--gold);
    border-color:rgba(212,168,67,0.5);
  }

  /* ── Spinner ── */
  .spinner{
    width:17px; height:17px;
    border:2px solid rgba(26,23,16,0.3);
    border-top-color:#1a1710;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none; flex-shrink:0;
  }
  .btn-primary.loading .spinner{ display:block; }
  .btn-primary.loading .btn-text{ opacity:0.7; }

  /* ── Status ── */
  .status{
    margin-top:12px; font-size:12.5px;
    min-height:0; line-height:1.5;
    border-radius:var(--radius-xs);
    transition:all var(--t);
  }
  .status:not(:empty){ padding:9px 12px; }
  .status.ok { color:var(--ok); background:var(--ok-bg); border:1px solid rgba(78,148,96,0.2); }
  .status.err{ color:var(--danger); background:var(--danger-bg); border:1px solid rgba(192,82,74,0.2); }

  /* ── Footer ── */
  .footer-note{ margin-top:18px; font-size:10.5px; color:var(--faint); }

  /* ── Success Screen ── */
  #successScreen{ display:none; animation:slideUp 0.4s ease; }
  .success-ring{
    width:72px; height:72px;
    border-radius:50%;
    background:var(--ok-bg);
    border:2px solid rgba(78,148,96,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    margin:0 auto 18px;
    animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .success-title{
    font-size:18px;
    font-weight:bold;
    color:var(--ok);
    margin-bottom:8px;
    letter-spacing:0.5px;
  }
  .success-sub{
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
    margin-bottom:6px;
  }
  .success-tip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--gold);
    background:var(--gold-glow);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 14px;
    margin-top:14px;
  }

  /* ── Keyframes ── */
  @keyframes spin { to{ transform:rotate(360deg); } }
  @keyframes slideUp {
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }
  @keyframes popIn {
    from{ transform:scale(0.5); opacity:0; }
    to  { transform:scale(1);   opacity:1; }
  }
  @keyframes pulse {
    0%,100%{ opacity:1; transform:scale(1); }
    50%     { opacity:0.5; transform:scale(0.8); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-accent"></div>
  <div class="card-body">

    <!-- 步驟指示 -->
    <div class="steps">
      <div class="step-dot" id="dot1"></div>
      <div class="step-line" id="line1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-line" id="line2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <!-- ① 主流程畫面 -->
    <div id="mainScreen">
      <div class="biz-badge" id="bizBadge">載入中</div>
      <h1 id="titleText">會員身分綁定</h1>
      <p class="sub" id="subText">請確認資料後點擊下方按鈕，完成後即可透過 LINE 接收通知。</p>

      <!-- LINE 個人資料 -->
      <div class="profile" id="profileBox" style="display:none;">
        <div class="avatar-wrap">
          <img id="profileAvatar" src="" alt="頭像">
          <div class="avatar-check">✓</div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profileName"></div>
          <div class="profile-hint">
            <span>●</span> LINE 帳號已驗證
          </div>
        </div>
      </div>

      <hr class="divider" id="formDivider" style="display:none;">

      <!-- 代號輸入框 -->
      <div class="field">
        <label id="codeLabel">綁定代號</label>
        <div class="input-wrap">
          <span class="input-icon">🔖</span>
          <input type="text" id="codeInput" inputmode="text"
                 placeholder="請輸入代號" autocomplete="off" maxlength="60">
        </div>
      </div>

      <!-- 送出按鈕 -->
      <button class="btn-primary" id="submitBtn" disabled>
        <div class="spinner"></div>
        <span class="btn-text">載入中…</span>
      </button>

      <!-- 重試按鈕（失敗時出現）-->
      <button class="btn-ghost" id="retryBtn" style="display:none;" onclick="retry()">
        🔄 重新嘗試
      </button>

      <div class="status" id="statusMsg"></div>
      <div class="footer-note"><span id="bizFooter"></span></div>
    </div>

    <!-- ② 成功畫面 -->
    <div id="successScreen">
      <div class="success-ring">✓</div>
      <div class="success-title">綁定回報完成</div>
      <p class="success-sub">
        您的 LINE 帳號已傳送給管理員。<br>
        請至聊天室按下「傳送」鍵完成最後一步。
      </p>
      <div class="success-tip">
        💬 沒有自動開啟？
      </div>
      <button class="btn-ghost" style="margin-top:10px;" onclick="reopenChat()">
        📬 重新開啟聊天室
      </button>
    </div>

  </div><!-- /card-body -->
</div><!-- /card -->

<script>
/* ============================================================
   系統設定區
   ============================================================ */
const SYSTEM_OA_ID = "@768srubj";

const BIZ_CONFIG = {
  jxc: {
    liffId: "2008956794-cft16qHd",
    label: "進銷存客戶", title: "請款單客戶綁定",
    sub: "請確認資料後點擊【回報綁定】，日後通知將透過LINE發送給您。",
    codeLabel: "客戶代號"
  },
  yxg: {
    liffId: "REPLACE_WITH_YXG_LIFF_ID",
    label: "梅山玉虛宮信眾", title: "信眾會員綁定",
    sub: "請確認資料後點擊【回報綁定】，日後請柬將透過LINE通知您。",
    codeLabel: "信眾代號"
  },
  zfh: {
    liffId: "REPLACE_WITH_ZFH_LIFF_ID",
    label: "照服工會會員", title: "繳費通知綁定",
    sub: "請確認資料後點擊【回報綁定】，日後通知將透過LINE發送給您。",
    codeLabel: "會員代號"
  }
};

/* ── DOM refs ── */
const $ = id => document.getElementById(id);
const bizBadge   = $("bizBadge"),   titleText  = $("titleText");
const subText    = $("subText"),    codeLabel  = $("codeLabel");
const codeInput  = $("codeInput"),  submitBtn  = $("submitBtn");
const statusMsg  = $("statusMsg"),  profileBox = $("profileBox");
const bizFooter  = $("bizFooter"),  retryBtn   = $("retryBtn");
const formDivider= $("formDivider");
const dot1=$("dot1"), dot2=$("dot2"), dot3=$("dot3");
const line1=$("line1"), line2=$("line2");

let userProfile = null;
let cfg         = null;
let lastOaUrl   = "";
let submitted   = false;

/* ── 步驟指示 ── */
function setStep(n){
  const dots  = [dot1, dot2, dot3];
  const lines = [line1, line2];
  dots.forEach((d,i)=>{
    d.className = "step-dot" +
      (i+1 < n ? " done" : i+1===n ? " active" : "");
  });
  lines.forEach((l,i)=>{
    l.className = "step-line" + (i+1 < n ? " done" : "");
  });
}

/* ── 網址參數 ── */
const PARAM_CACHE_KEY = "liffRegisterParams";
function getParams(){
  const qs = new URLSearchParams(location.search);
  let biz = qs.get("biz"), code = qs.get("code");
  if(!biz && qs.has("liff.state")){
    const s = new URLSearchParams(
      (qs.get("liff.state")||"").replace(/^\?/,"")
    );
    biz = s.get("biz"); code = s.get("code");
  }
  return { biz, code };
}

let { biz, code: presetCode } = getParams();
if(biz){
  try{ sessionStorage.setItem(PARAM_CACHE_KEY, JSON.stringify({biz, code:presetCode})); }catch(e){}
}else{
  try{
    const saved = JSON.parse(sessionStorage.getItem(PARAM_CACHE_KEY)||"null");
    if(saved && saved.biz){ biz=saved.biz; presetCode=saved.code; }
  }catch(e){}
}

/* ── 狀態顯示 ── */
function showStatus(text, type){
  statusMsg.textContent = text;
  statusMsg.className = "status" + (type ? " "+type : "");
}

/* ── 按鈕載入態 ── */
function setBtnLoading(loading, label){
  submitBtn.disabled = loading;
  submitBtn.classList.toggle("loading", loading);
  submitBtn.querySelector(".btn-text").textContent = label;
}

/* ── 初始化 UI 文字 ── */
function initUi(){
  cfg = BIZ_CONFIG[biz];
  if(!cfg){
    bizBadge.textContent  = "設定錯誤";
    titleText.textContent = "連結參數不正確";
    subText.textContent   = "請確認連結是否包含正確的 biz 參數（例如 ?biz=jxc）。";
    submitBtn.style.display = "none";
    return false;
  }
  bizBadge.textContent  = cfg.label;
  titleText.textContent = cfg.title;
  subText.textContent   = cfg.sub;
  codeLabel.textContent = cfg.codeLabel;
  bizFooter.textContent = "業務識別：" + biz.toUpperCase();
  if(presetCode){ codeInput.value = presetCode; codeInput.readOnly = true; }
  return true;
}

/* ── 顯示成功畫面 ── */
function showSuccess(){
  $("mainScreen").style.display    = "none";
  $("successScreen").style.display = "block";
  setStep(3);
}

/* ── 開啟 OA 聊天室 ── */
function openOa(url){
  try{
    if(typeof liff !== "undefined" && liff.openWindow){
      liff.openWindow({ url, external:false });
    }else{ location.href = url; }
  }catch(e){ location.href = url; }
}

/* ── 重新開啟聊天室 ── */
function reopenChat(){
  if(lastOaUrl) openOa(lastOaUrl);
}

/* ── 主流程 ── */
async function boot(){
  if(!initUi()) return;
  setStep(1);
  retryBtn.style.display = "none";
  setBtnLoading(true, "驗證 LINE 身分中…");
  showStatus("","");

  let settled = false;
  const tid = setTimeout(()=>{
    if(!settled) showStatus("網路回應較慢，請檢查網路連線。","err");
  }, 8000);

  try{
    await liff.init({ liffId: cfg.liffId });

    if(!liff.isLoggedIn()){
      showStatus("正在導向 LINE 登入…","");
      liff.login({ redirectUri: location.href });
      return;
    }

    setStep(2);
    userProfile = await liff.getProfile();

    $("profileAvatar").src =
      userProfile.pictureUrl ||
      "https://static.line-scdn.net/liff/edge/2/img/default-avatar.png";
    $("profileName").textContent = userProfile.displayName || "LINE 用戶";
    profileBox.style.display  = "flex";
    formDivider.style.display = "block";

    settled = true; clearTimeout(tid);
    setBtnLoading(false, "回報綁定");
    showStatus("","");

  }catch(err){
    settled = true; clearTimeout(tid);
    console.error(err);
    const detail = err?.code || err?.message || String(err);
    showStatus("初始化失敗：" + detail, "err");
    setBtnLoading(false, "無法使用");
    submitBtn.disabled = true;
    retryBtn.style.display = "block";
  }
}

/* ── 重試 ── */
function retry(){
  userProfile = null;
  submitted   = false;
  profileBox.style.display  = "none";
  formDivider.style.display = "none";
  boot();
}

/* ── 送出事件 ── */
submitBtn.addEventListener("click", ()=>{
  if(submitted) return;

  const code = codeInput.value.trim();
  if(!code){ showStatus("請輸入代號後再送出。","err"); return; }
  if(!userProfile){ showStatus("尚未取得 LINE 個人資料，請重新整理。","err"); return; }

  const reportText =
    `【綁定回報】\n` +
    `業務類別：${biz.toUpperCase()}\n` +
    `${cfg.codeLabel}：${code}\n` +
    `客戶名稱：${userProfile.displayName}\n` +
    `LINE_ID：\n` +
    `${userProfile.userId}`;

  // ⚠️ SYSTEM_OA_ID 不可 encodeURIComponent（@ 會變成 %40 導致 400）
  lastOaUrl =
    "https://line.me/R/oaMessage/" +
    SYSTEM_OA_ID + "/?" +
    encodeURIComponent(reportText);

  openOa(lastOaUrl);

  submitted = true;
  showSuccess();
});

boot();
</script>
</body>
</html>
